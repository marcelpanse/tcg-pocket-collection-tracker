name: Verify cards

on:
  pull_request:
    paths:
      - 'frontend/assets/cards.json'

permissions:
  contents: read

jobs:
  verify-cards:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout 🛠️
        uses: actions/checkout@v4

      - name: Fetch base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # cards.json is generated from the Pokémon Zone data (pnpm import-pokemon-zone), which can't be
      # downloaded from CI, so instead check that no existing card disappeared or changed internal_id
      - name: Verify cards
        run: pnpm verify-cards origin/${{ github.base_ref }}
